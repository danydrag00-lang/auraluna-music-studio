name: Acoustic sample pitch audit
on:
  push:
    paths: ['scripts/audit_pitch.py','.github/workflows/pitch-audit.yml','catalog/index.json']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install numpy scipy
      - run: python scripts/audit_pitch.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitch-audit
          path: catalog/pitch-audit.json
