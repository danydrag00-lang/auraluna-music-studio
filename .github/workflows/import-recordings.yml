name: Import real recordings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['catalog/recording-sources.json','scripts/import_recordings.py','.github/workflows/import-recordings.yml']
permissions:
  contents: write
concurrency:
  group: import-real-recordings
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 scripts/import_recordings.py
      - uses: actions/upload-artifact@v4
        with:
          name: recording-import-report
          path: catalog/recording-import-report.json
      - name: Commit audition recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio catalog/index.json catalog/recording-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import licensed recordings for listening review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
