name: Backend reliability
on:
  push:
    branches: [main]
    paths:
      - 'backend/v9/**'
      - 'tests/backend_checks.py'
      - '.github/workflows/backend-reliability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install numpy soundfile
      - run: python -m compileall -q backend/v9
      - run: node --check src/v9-studio.mjs
      - run: node --input-type=module --check < backend/v9/worker.js
      - run: python tests/backend_checks.py
