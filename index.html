<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auraluna Music Studio</title><link rel="stylesheet" href="style.css"></head><body><aside><strong>AURALUNA <small> / STUDIO</small></strong><nav><a href="#create">Create music</a><a href="#library">Sound library</a><a href="#results">Previews</a></nav><p>Independent acoustic music workspace</p></aside><main><header><span>COMPOSITION WORKSPACE</span><h1>Make room for sound.</h1><p>Compose original instrumental arrangements from your own verified sample library.</p></header><section id="create"><h2>01 / Create</h2><label for="prompt">Describe your music</label><textarea id="prompt" placeholder="Peaceful piano for sleep, gentle and spacious"></textarea><div class="controls"><label>Mood<select id="mood"><option value="spa">Luxury spa</option><option value="sleep">Deep sleep</option><option value="zen">Zen</option><option value="indian">Indian-inspired</option><option value="focus">Focus</option></select></label><label>Preview length<select id="duration"><option>30</option><option>60</option><option>120</option></select></label></div><fieldset id="instruments"><legend>Available instruments</legend></fieldset><button id="generate" disabled>Generate three previews</button><p id="status" role="status" aria-live="polite"></p></section><section id="results"><h2>02 / Listen & compare</h2><div id="previews"></div></section><section id="library"><h2>03 / Sound library</h2><p id="count"></p><input id="search" placeholder="Search recordings" aria-label="Search recordings"><div id="assets"></div></section></main><script type="module" src="src/app.mjs"></script></body></html>
